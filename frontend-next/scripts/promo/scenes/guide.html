<!doctype html>
<!--
  Full "how it works" guide, about 92 s, 9:16 (360 x 640 units, rendered at
  2x = 720 x 1280). Opens from the "Watch how it works" button; never autoplays.
  Slow and wordless so anyone can follow: a hand shows every tap, the camera
  zooms in on each field, and a numbered badge shows the six steps.
  Shots are in shots.js. Rendered by scripts/promo/render.mjs.
-->
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#f8fafc}svg{display:block}</style>
<script src="common.js"></script>
<script src="engine.js"></script>
<script src="shots.js"></script>
</head>
<body>
<svg id="svg" width="360" height="640" viewBox="0 0 360 640" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const S = window.SHOTS;
window.ENGINE.run([S.intro(), S.life(), S.start(), S.pathA(), S.pathB(), S.fill(), S.style(), S.publish(), S.feed(), S.buyers(), S.finale()], { steps: true });
</script>
</body>
</html>
