    <rect x="225" y="123" width="10" height="4" rx="1" fill="#0a0a0a"/>
    <!-- bottom-right -->
    <rect x="191" y="186" width="32" height="22" rx="4" fill="#ffffff"/>
    <rect x="198" y="190" width="10" height="4" rx="1" fill="#0a0a0a"/>
    <!-- bottom -->
    <rect x="124" y="213" width="32" height="22" rx="4" fill="#ffffff"/>
    <rect x="131" y="217" width="10" height="4" rx="1" fill="#0a0a0a"/>
    <!-- bottom-left -->
    <rect x="57" y="186" width="32" height="22" rx="4" fill="#ffffff"/>
    <rect x="64" y="190" width="10" height="4" rx="1" fill="#0a0a0a"/>
    <!-- left -->
    <rect x="30" y="119" width="32" height="22" rx="4" fill="#ffffff"/>
    <rect x="37" y="123" width="10" height="4" rx="1" fill="#0a0a0a"/>
