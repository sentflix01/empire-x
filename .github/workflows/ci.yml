name: Nodbusiness CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/docs-sync.yml'
      - '.github/workflows/db-migrate-to-supabase.yml'
  # Every pull request runs CI, docs-only ones too: main requires these checks,
  # so a PR that never reports them could never be merged.
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for the workflow token (audit F-022); jobs ask for more only where needed.
permissions:
  contents: read

jobs:
  # ── Skip guard — exit early for bot commits or [skip ci] messages ────────────
  check-skip:
    name: Check skip conditions
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        # Commit text reaches bash through env vars, never ${{ }} interpolation,
        # so a crafted commit message cannot inject shell commands.
        env:
          author_name: ${{ github.event.head_commit.author.name || '' }}
          author_email: ${{ github.event.head_commit.author.email || '' }}
          msg: ${{ github.event.head_commit.message || '' }}
        run: |
          # 1) Explicit skip markers in the commit message always skip.
          if [[ "${msg}" == *"[skip ci]"* || "${msg}" == *"[ci skip]"* ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          # 2) Skip if the commit author is the known docs bot.
          elif [[ "${author_name}" == "nodbusiness-docs-bot" || "${author_email}" == "docs-bot@nodbusiness.app" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Typecheck & Tests (blocking)
    needs: check-skip
    if: needs.check-skip.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # PostgreSQL comes preinstalled on GitHub's Ubuntu runners. Starting it
    # avoids pulling a container image: ECR Public returned "toomanyrequests:
    # Data limit exceeded" repeatedly on 2026-10-16 and blocked production deploys.

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://nodbusiness:testpassword@localhost:5432/nodbusiness_test
      JWT_SECRET: ci-test-secret-do-not-use-in-production-at-all
      PORT: 3001

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE USER nodbusiness WITH PASSWORD 'testpassword' SUPERUSER;"
          sudo -u postgres createdb -O nodbusiness nodbusiness_test
          pg_isready -h localhost -p 5432
          psql --version

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (blocking)
        run: npx tsc --noEmit

      - name: Run migrations
        run: npm run migrate

      # Same routes and migrations against this real Postgres (no mocked pool):
      # catches wrong columns, broken placeholders and migrations that would
      # fail on the next deploy.
      - name: Database-backed tests (blocking)
        run: npm run test:db

      # Jest unit/integration suites — the proven green gate (257 tests).
      # The live-server e2e script stays out of the blocking path.
      - name: Run tests (blocking)
        run: npx jest --runInBand --forceExit --testTimeout=10000

  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js) — Lint, Type-check & Build
    needs: check-skip
    if: needs.check-skip.outputs.skip != 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-next

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint (blocking)
        run: npm run lint

      # Clean as of 2026-08-23 (0 errors) — kept blocking to stay that way.
      - name: Type-check (blocking)
        run: npx tsc --noEmit

      - name: Build (blocking)
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://example-ci-build.nodbusiness.app
          NEXT_PUBLIC_APP_URL: https://example-ci-build.pages.dev
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-placeholder-google-client-id
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
          NEXT_PUBLIC_SENTRY_DSN: ""

      # Tailwind v4 silently drops a class whose theme token or plugin is missing
      # (this hid card, button and dialog styling from July to October 2026).
      - name: CSS utility check (blocking)
        run: npm run check:css

  # Vitest 5 and jsdom need Node 22+, so unit tests run in their own job and
  # the build job keeps the Node version used for deployment.
  frontend-tests:
    name: Frontend (Next.js) — Unit tests (blocking)
    needs: check-skip
    if: needs.check-skip.outputs.skip != 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-next

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Vitest (blocking)
        run: npm test

  # ── Security audit ───────────────────────────────────────────────────────────
  # Hard gate at --audit-level=high for both packages.
  # "high" catches CVSS ≥7.0. Critical and high severity vulnerabilities
  # must be resolved before a merge to main can land.
  # Uses --package-lock-only so no npm ci needed — saves ~2 min per run.
  secrets:
    name: Secret scan — new commits (report-only for now)
    # gitleaks over the commits this pull request or push adds (audit F-024).
    # Report-only until its first runs are reviewed; then delete
    # continue-on-error to make it blocking. Also turn on GitHub secret scanning
    # and push protection in the repository settings.
    needs: check-skip
    if: needs.check-skip.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks 8.29.1 (checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.29.1/gitleaks_8.29.1_linux_x64.tar.gz
          echo "e4eb209d04e20339d77122a3bdf9cd41351255cfb27ebcb75e85325e04f88924  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan the new commits
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="origin/${BASE_REF}..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${BEFORE}..${AFTER}"
          else
            RANGE="HEAD~1..HEAD"
          fi
          echo "Scanning ${RANGE}"
          # --verbose lists each finding (rule, file, line, commit) with the value redacted.
          ./gitleaks git --log-opts="${RANGE}" --redact --verbose --no-banner --exit-code 1 .

  e2e:
    name: E2E — Chromium journeys (blocking)
    # The browser journeys (sign-in, sign-up, checkout, chat, accessibility,
    # security headers, performance budget, service worker) against a production
    # build and a throwaway Postgres (audit F-032). The two-person messaging
    # suite runs in e2e-messaging.yml.
    needs: check-skip
    if: needs.check-skip.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://nodbusiness:testpassword@localhost:5432/nodbusiness_e2e
      DATABASE_URL_REQUIRE_TLS: 'false'
      JWT_SECRET: ci-e2e-secret-do-not-use-in-production-at-all
      ALLOW_E2E_SEED: '1'
      E2E_TEST_EMAIL: e2e-buyer@example.test
      E2E_ADMIN_EMAIL: e2e-seller@example.test
      E2E_BACKEND_URL: http://localhost:3001
      E2E_FRONTEND_URL: http://localhost:3002
      E2E_SKIP_BACKEND: 'true'
      E2E_SKIP_FRONTEND: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend-next/package-lock.json

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE USER nodbusiness WITH PASSWORD 'testpassword' SUPERUSER;"
          sudo -u postgres createdb -O nodbusiness nodbusiness_e2e
          pg_isready -h localhost -p 5432

      - name: One-off passwords for the test accounts
        run: |
          echo "E2E_TEST_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      - name: Backend — install, migrate, seed, start
        working-directory: backend
        env:
          NODE_ENV: development
          PORT: '3001'
          FRONTEND_URL: http://localhost:3002
          # Built-in fake Chapa (refused in production) so plan payments complete.
          CHAPA_SECRET_KEY: SANDBOX
        run: |
          npm ci
          npm run migrate
          npm run seed:e2e
          nohup npx tsx index.ts > ../backend.log 2>&1 &
          npx --yes wait-on@8.0.3 -t 120000 http://localhost:3001/health

      - name: Frontend — build and start
        working-directory: frontend-next
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
          NEXT_PUBLIC_APP_URL: http://localhost:3002
          # Well-formed but fake: the Google button renders; no real Google call is made.
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: 000000000000-e2eplaceholder.apps.googleusercontent.com
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
          NEXT_PUBLIC_SENTRY_DSN: ''
        run: |
          npm ci --legacy-peer-deps
          npm run build
          nohup npx next start -p 3002 > ../frontend.log 2>&1 &
          npx --yes wait-on@8.0.3 -t 120000 http://localhost:3002/landing

      - name: Playwright browser
        working-directory: frontend-next
        run: npx playwright install --with-deps chromium

      - name: Journeys (blocking)
        working-directory: frontend-next
        env:
          NODE_ENV: development
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-report.json
        run: npx playwright test --project=chromium --reporter=list,json

      - name: No skipped journeys (blocking)
        working-directory: frontend-next
        run: node e2e/check-no-skips.mjs e2e-report.json

      - name: Keep the evidence when it fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-chromium-results
          path: |
            frontend-next/test-results
            frontend-next/e2e-report.json
            backend.log
            frontend.log
          retention-days: 7

  audit:
    name: Security Audit (blocking — high+)
    needs: check-skip
    if: needs.check-skip.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend-next/package-lock.json

      # Fail on any high/critical advisory EXCEPT advisories in the
      # temporary-ignore list. Every entry must name the advisory ID and
      # the reason (usually: dev-only tooling, no end-user impact, no
      # patched release available yet).
      - name: Audit backend
        working-directory: backend
        run: |
          npm audit --json --package-lock-only > audit.json || true
          node scripts/audit-ignore-list.cjs audit.json "['GHSA-mrwp-f3q8-3g9p']" || exit 1
          # GHSA-mrwp-f3q8-3g9p: follow-redirects cross-realm sensitiveHeaders — transitive
          #   dev/build tooling dep (webpack/next internals); not reachable by end-user requests.

      - name: Audit frontend (Next.js)
        working-directory: frontend-next
        run: |
          npm audit --json --package-lock-only --legacy-peer-deps > audit.json || true
          node ../backend/scripts/audit-ignore-list.cjs audit.json "['GHSA-vfj7-8cjw-p6xm','GHSA-c6gr-qvv4-5v3f','GHSA-cg2g-xh64-v4q7','GHSA-mrv2-3pqr-j5jr','GHSA-mrwp-f3q8-3g9p']" || exit 1
          # GHSA-vfj7-8cjw-p6xm: braces ReDoS — dev-only transitive dep, no end-user impact
          # GHSA-c6gr-qvv4-5v3f: dompurify low — no patched release available as of 2026-10-22
          # GHSA-cg2g-xh64-v4q7: dompurify critical — no patched release available as of 2026-10-22; app does not call DOMPurify.sanitize() directly
          # GHSA-mrv2-3pqr-j5jr: dompurify critical — no patched release available as of 2026-10-22; app does not call DOMPurify.sanitize() directly
          # GHSA-mrwp-f3q8-3g9p: follow-redirects cross-realm sensitiveHeaders — transitive dev/build dep; not reachable by end-user requests
