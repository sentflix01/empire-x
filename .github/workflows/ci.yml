name: Nodbusiness CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/docs-sync.yml'
      - '.github/workflows/db-migrate-to-neon.yml'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Typecheck & Tests (blocking)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nodbusiness
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: nodbusiness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://nodbusiness:testpassword@localhost:5432/nodbusiness_test
      JWT_SECRET: ci-test-secret-do-not-use-in-production-at-all
      PORT: 3001

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (blocking)
        run: npx tsc --noEmit

      - name: Run migrations
        run: npm run migrate

      # Jest unit/integration suites — the proven green gate (257 tests).
      # The live-server e2e script stays out of the blocking path.
      - name: Run tests (blocking)
        run: npx jest --runInBand

  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js) — Lint, Type-check & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-next

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint (blocking)
        run: npm run lint

      # Clean as of 2026-08-23 (0 errors) — kept blocking to stay that way.
      - name: Type-check (blocking)
        run: npx tsc --noEmit

      - name: Build (blocking)
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://example-ci-build.onrender.com
          NEXT_PUBLIC_APP_URL: https://example-ci-build.vercel.app
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-placeholder-google-client-id
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
          NEXT_PUBLIC_SENTRY_DSN: ""

  # ── Security audit ───────────────────────────────────────────────────────────
  # Advisory until the dependency backlog is cleared; then flip
  # --audit-level=high into a hard gate.
  # Uses --package-lock-only so no npm ci needed — saves ~2 min per run.
  audit:
    name: Security Audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Audit backend
        run: npm audit --audit-level=high --prefix backend --package-lock-only || true

      - name: Audit frontend (Next.js)
        run: npm audit --audit-level=high --prefix frontend-next --package-lock-only --legacy-peer-deps || true
