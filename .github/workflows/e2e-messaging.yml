name: Messaging E2E (two people, four devices)

# The two-person messaging suite (frontend-next/e2e/messaging.spec.ts) on a
# phone, an iPhone, a tablet and a computer, against a throwaway Postgres on
# the runner. Not a required check: it runs on messaging changes and on demand.
on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - 'frontend-next/views/ChatRoom.tsx'
      - 'frontend-next/views/Messages.tsx'
      - 'frontend-next/views/ChatMembers.tsx'
      - 'frontend-next/components/messaging/**'
      - 'frontend-next/lib/messaging.ts'
      - 'frontend-next/lib/socket.ts'
      - 'frontend-next/e2e/messaging.spec.ts'
      - 'frontend-next/playwright.config.ts'
      - 'backend/routes/messages.ts'
      - 'backend/lib/messaging.ts'
      - 'backend/socket.ts'
      - 'backend/db/seed-e2e-messaging.js'
      - '.github/workflows/e2e-messaging.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  messaging-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: postgresql://nodbusiness:testpassword@localhost:5432/nodbusiness_e2e
      DATABASE_URL_REQUIRE_TLS: 'false'
      JWT_SECRET: ci-e2e-secret-do-not-use-in-production-at-all
      ALLOW_E2E_SEED: '1'
      E2E_BACKEND_URL: http://localhost:3001
      E2E_FRONTEND_URL: http://localhost:3002
      E2E_SKIP_BACKEND: 'true'
      E2E_SKIP_FRONTEND: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend-next/package-lock.json

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE USER nodbusiness WITH PASSWORD 'testpassword' SUPERUSER;"
          sudo -u postgres createdb -O nodbusiness nodbusiness_e2e
          pg_isready -h localhost -p 5432

      - name: A one-off password for the test accounts
        run: echo "E2E_MESSAGING_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      - name: Backend — install, migrate, start
        working-directory: backend
        env:
          NODE_ENV: development
          PORT: '3001'
          FRONTEND_URL: http://localhost:3002
        run: |
          npm ci
          npm run migrate
          nohup npx tsx index.ts > ../backend.log 2>&1 &
          npx --yes wait-on@8.0.3 -t 120000 http://localhost:3001/health

      - name: Frontend — build and start
        working-directory: frontend-next
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
          NEXT_PUBLIC_APP_URL: http://localhost:3002
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-placeholder-google-client-id
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
          NEXT_PUBLIC_SENTRY_DSN: ''
        run: |
          npm ci --legacy-peer-deps
          npm run build
          nohup npx next start -p 3002 > ../frontend.log 2>&1 &
          npx --yes wait-on@8.0.3 -t 120000 http://localhost:3002/landing

      - name: Playwright browsers
        working-directory: frontend-next
        run: npx playwright install --with-deps chromium webkit

      - name: Two-person messaging on phone, iPhone, tablet and desktop
        working-directory: frontend-next
        env:
          NODE_ENV: development
        run: >-
          npx playwright test
          --project=messaging-phone --project=messaging-iphone
          --project=messaging-tablet --project=messaging-desktop

      - name: Keep the evidence when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: messaging-e2e-results
          path: |
            frontend-next/test-results
            backend.log
            frontend.log
          retention-days: 7
