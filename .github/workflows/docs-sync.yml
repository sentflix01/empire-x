name: Nodbusiness Docs Sync

# Keeps docs/Production/ and the generated API reference in lockstep with code.
# Runs AFTER CI succeeds on main and force-pushes the regenerated docs to the
# "docs-sync" branch. main is protected (PR + green CI), and a personal-account
# repository cannot exempt this bot, so docs reach main through a pull request:
# open one from docs-sync when you want them (opening it yourself starts CI).
on:
  workflow_run:
    workflows: ["Nodbusiness CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: docs-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Sync Production encyclopedia
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps (for API catalog generation)
        run: npm ci
        working-directory: backend

      - name: Regenerate API reference + catalog
        run: npm run docs:api
        working-directory: backend

      - name: Generate implementation log reports
        run: node scripts/generate-task-report.cjs

      - name: Sync Production encyclopedia
        run: node scripts/production-docs-sync.cjs

      - name: Commit updated docs
        id: commit
        run: |
          git config user.name "sentflix01"
          git config user.email "sentflix01@users.noreply.github.com"
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard docs/)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Docs already in sync"
          else
            git add docs/
            # Commit touches ONLY docs/ — ci.yml ignores docs/** so this push
            # will NOT re-trigger CI, breaking the loop.
            git commit -m "docs(sync): auto-update Production encyclopedia + API reference [skip ci]"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Push to the docs-sync branch
        if: steps.commit.outputs.changed == 'true'
        # The branch is rebuilt from main on every run, so a force push is safe.
        run: git push --force origin HEAD:refs/heads/docs-sync
