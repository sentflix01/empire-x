name: DB migrate -> PostgreSQL (manual)

# Runs all pending migrations against the production PostgreSQL database.
# Use this when you add a new migrate*.js file and want to apply it to production
# without waiting for a full Render deploy.
#
# Requires the DATABASE_URL secret. For Neon, use the direct (non-pooled)
# connection string from the Console for migrations.

on:
  workflow_dispatch:

jobs:
  migrate:
    name: Run migrations on PostgreSQL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "ERROR: DATABASE_URL secret is not set."
            echo "Go to: GitHub → Settings → Secrets and variables → Actions → New repository secret"
            echo "Value: production PostgreSQL connection string (Neon: use the direct URI)"
            exit 1
          fi
          echo "✅ DATABASE_URL is set."

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run all migrations
        run: node db/migrate-all.js
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Verify tables
        run: node db/check-supabase.js
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
