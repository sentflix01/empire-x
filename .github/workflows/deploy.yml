name: Nodbusiness Deploy

# Deploys ONLY after CI ("Nodbusiness CI") succeeds on main (TD-019).
# The push trigger was removed: deploys are chained to the CI run instead,
# so a red build can never reach production.
on:
  workflow_run:
    workflows: ["Nodbusiness CI"]
    types: [completed]
    branches: [main]

# Only run one deploy at a time
concurrency:
  group: deploy-production
  # Only the newest commit needs to reach production. Cancelling an obsolete
  # workflow prevents stale Vercel jobs from queuing behind it.
  cancel-in-progress: true

jobs:
  # ── Gate: only proceed when the pinned CI run passed for this exact commit ──
  gate:
    name: Gate — require green CI on this commit
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Check CI result and commit match
        id: check
        run: |
          echo "CI conclusion : ${{ github.event.workflow_run.conclusion }}"
          echo "CI head commit : ${{ github.event.workflow_run.head_commit.id }}"
          echo "Deploy target  : ${{ github.sha }}"
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "❌ CI did not pass — blocking deploy."
            echo "proceed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ -n "${{ github.event.workflow_run.head_commit.id }}" ] && \
             [ "${{ github.event.workflow_run.head_commit.id }}" != "${{ github.sha }}" ]; then
            echo "ℹ️ A newer commit is queued — letting its own deploy handle this."
            echo "proceed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "✅ Green CI for this exact commit."
          echo "proceed=true" >> $GITHUB_OUTPUT

  # ── Detect whether the frontend actually changed ───────────────────────────
  changes:
    name: Detect deploy scope
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changed.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - id: changed
        name: Check frontend files
        run: |
          if git diff --quiet HEAD^ HEAD -- frontend-next; then
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ No frontend changes — skipping Vercel deployment."
          else
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "✅ Frontend changes detected — Vercel deployment required."
          fi

  # ── Run DB Migrations on Supabase ───────────────────────────────────────────
  # The application must never deploy against an older schema. The migration
  # runner is idempotent, so an already-current database exits cleanly.
  migrate:
    name: Run DB Migrations → Supabase
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run migrations
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "⚠️  SUPABASE_DATABASE_URL secret is not set in the 'production' GitHub environment."
            echo "    Migrations cannot run without a database URL."
            echo "    → Go to: GitHub repo → Settings → Environments → production → Add secret"
            echo "    → Secret name: SUPABASE_DATABASE_URL"
            echo "    → Value: your Supabase connection string (Settings → Database → URI)"
            echo "    Re-run this workflow after adding the secret."
            exit 1
          fi
          node db/migrate-all.js
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}

  # ── Deploy Backend to Render ─────────────────────────────────────────────────
  # Render watches the connected GitHub repo for auto-deploys on push to main.
  # This job provides an optional explicit deploy path via CLI when the Render
  # API key is available. If the token is missing or invalid, the deploy simply
  # waits for Render's git-integration to pick up the latest push.
  deploy-backend:
    name: Deploy Backend → Render
    needs: [gate, migrate]
    if: needs.gate.outputs.proceed == 'true' && needs.migrate.result == 'success'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v7

      - name: Check Render token
        id: token_check
        run: |
          if [ -z "${{ secrets.RENDER_API_KEY }}" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "⚠️  RENDER_API_KEY secret is not set. Render will auto-deploy via git integration."
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
            echo "✅ RENDER_API_KEY found — will attempt explicit deploy."
          fi

      - name: Install Render CLI
        if: steps.token_check.outputs.has_token == 'true'
        run: curl -fsSL https://render.com/install.sh | bash

      - name: Validate Render token
        if: steps.token_check.outputs.has_token == 'true'
        id: validate_token
        continue-on-error: true
        run: |
          if render auth whoami; then
            echo "token_valid=true" >> $GITHUB_OUTPUT
          else
            echo "token_valid=false" >> $GITHUB_OUTPUT
            echo "⚠️  RENDER_API_KEY is set but invalid/expired."
            echo "    To fix: Render → Account Settings → API Keys → Create Key"
            echo "    Then update: GitHub → Settings → Secrets → RENDER_API_KEY"
          fi
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

      - name: Deploy to Render
        if: steps.token_check.outputs.has_token == 'true' && steps.validate_token.outputs.token_valid == 'true'
        run: render deploy --service-id=${{ secrets.RENDER_SERVICE_ID }} --force
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

      - name: Render auto-deploy notice
        if: steps.token_check.outputs.has_token != 'true' || steps.validate_token.outputs.token_valid != 'true'
        run: |
          echo "ℹ️  Explicit Render CLI deploy skipped."
          echo "    Render will deploy automatically from the GitHub git integration within 1–2 minutes."
          echo "    Check status at: https://dashboard.render.com"

  # ── Deploy Frontend to Vercel ─────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (Next.js) → Vercel
    needs: [gate, migrate, changes]
    if: needs.gate.outputs.proceed == 'true' && needs.migrate.result == 'success' && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment: production
    # The Vercel API has occasionally accepted an upload but kept the CLI
    # waiting for readiness. This prevents one remote stall consuming a runner.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend-next

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend-next

      - name: Deploy to Vercel
        id: deploy
        # `--no-wait` exits once Vercel has accepted the prebuilt artifact.
        # Vercel completes promotion asynchronously, while the post-deploy
        # health check verifies availability. This avoids holding the runner
        # indefinitely when Vercel's readiness API is slow.
        run: |
          for attempt in 1 2; do
            echo "Submitting Vercel deployment (attempt $attempt of 2)..."
            if vercel deploy --prebuilt --archive=tgz --prod --yes --no-wait --token=${{ secrets.VERCEL_TOKEN }}; then
              echo "✅ Vercel accepted the deployment request."
              exit 0
            fi

            if [ "$attempt" -lt 2 ]; then
              delay=5
              echo "⚠️ Upload failed. Retrying in ${delay}s..."
              sleep "$delay"
            fi
          done

          echo "❌ Vercel deployment failed after 2 upload attempts."
          exit 1
        working-directory: frontend-next

  # ── Post-deploy health check ─────────────────────────────────────────────────
  # Non-blocking: a failed health check logs a warning but does NOT fail the
  # workflow. The deploy itself (Backend → Render, Frontend → Vercel) already
  # succeeded. The health check is informational — it catches runtime issues
  # after deploy, but shouldn't block the pipeline.
  healthcheck:
    name: Post-deploy Health Check
    runs-on: ubuntu-latest
    needs: [gate, deploy-backend, deploy-frontend]
    # A skipped frontend deploy is valid for a backend-only change. `always()`
    # permits this diagnostic job to run in that case; the explicit backend
    # success check prevents it from masking a failed deploy.
    if: always() && needs.gate.outputs.proceed == 'true' && needs.deploy-backend.result == 'success' && (needs.deploy-frontend.result == 'success' || needs.deploy-frontend.result == 'skipped')
    continue-on-error: true

    steps:
      - name: Wait for services to stabilise
        run: sleep 15

      - name: Check backend health
        id: backend_health
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "⚠️  BACKEND_URL secret not set — marking check as skipped"
            echo "result=skipped" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Pinging $BACKEND_URL/health ..."
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 "$BACKEND_URL/health" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend healthy (attempt $i)"
              echo "result=ok" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "⏳ Attempt $i — status $STATUS, waiting 15s..."
            sleep 15
          done
          echo "⚠️  Backend returned non-200 after 3 attempts"
          echo "result=fail" >> $GITHUB_OUTPUT
          exit 0
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}

      - name: Check frontend health
        id: frontend_health
        if: needs.deploy-frontend.result == 'success'
        run: |
          CHECK_URL="${FRONTEND_URL:-https://halehame-eosin.vercel.app}"
          echo "Checking frontend at $CHECK_URL ..."
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 "$CHECK_URL" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "307" ] || [ "$STATUS" = "308" ]; then
              echo "✅ Frontend healthy (status $STATUS)"
              echo "result=ok" >> $GITHUB_OUTPUT
              exit 0
            fi
            sleep 15
          done
          echo "⚠️  Frontend returned status $STATUS after retries"
          echo "result=fail" >> $GITHUB_OUTPUT
          exit 0
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}

      - name: Notify Telegram on failure
        if: steps.backend_health.outputs.result == 'fail' || steps.frontend_health.outputs.result == 'fail'
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ℹ️ Telegram secrets not set — skipping notification"
            exit 0
          fi
          MSG=$'<b>Deploy health check FAILED</b>\nCommit: <code>'"${GITHUB_SHA}"'</code>\nBackend: '"${{ steps.backend_health.outputs.result }}"' · Frontend: '"${{ steps.frontend_health.outputs.result }}"$'\nAction: consider immediate rollback (git revert + push) per docs/infrastructure/CI_CD_PIPELINE.md'
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d parse_mode="HTML" \
            --data-urlencode text="$MSG" > /dev/null || true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_SHA: ${{ github.sha }}
