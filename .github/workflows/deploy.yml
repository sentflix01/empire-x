name: Nodbusiness Deploy

# Deploys ONLY after CI ("Nodbusiness CI") succeeds on main (TD-019).
# The push trigger was removed: deploys are chained to the CI run instead,
# so a red build can never reach production.
on:
  workflow_run:
    workflows: ["Nodbusiness CI"]
    types: [completed]
    branches: [main]

# Only run one deploy at a time
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  # ── Gate: only proceed when the pinned CI run passed for this exact commit ──
  gate:
    name: Gate — require green CI on this commit
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Check CI result and commit match
        id: check
        run: |
          echo "CI conclusion : ${{ github.event.workflow_run.conclusion }}"
          echo "CI head commit : ${{ github.event.workflow_run.head_commit.id }}"
          echo "Deploy target  : ${{ github.sha }}"
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "❌ CI did not pass — blocking deploy."
            echo "proceed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "✅ Green CI run accepted for its tested commit."
          echo "proceed=true" >> $GITHUB_OUTPUT

  # ── Detect whether the frontend actually changed ───────────────────────────
  changes:
    name: Detect deploy scope
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changed.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - id: changed
        name: Check frontend files
        run: |
          IS_MERGE=$(git rev-parse --verify HEAD^2 2>/dev/null && echo "true" || echo "false")
          if [ "$IS_MERGE" = "true" ]; then
            MERGE_BASE=$(git merge-base HEAD^1 HEAD^2)
            CHANGED=$(git diff --name-only "$MERGE_BASE" HEAD -- frontend-next)
          else
            CHANGED=$(git diff --name-only HEAD^ HEAD -- frontend-next)
          fi
          if [ -z "$CHANGED" ]; then
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ No frontend changes — skipping Vercel deployment."
          else
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "✅ Frontend changes detected — Vercel deployment required."
            echo "$CHANGED"
          fi

  # ── Run DB Migrations on Supabase ───────────────────────────────────────────
  # The application must never deploy against an older schema. The migration
  # runner is idempotent, so an already-current database exits cleanly.
  migrate:
    name: Run DB Migrations → Supabase
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Verify DB connection
        id: db_check
        continue-on-error: true
        run: node scripts/verify-db.js
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run migrations
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "⚠️  DATABASE_URL not set in the 'production' GitHub environment."
            echo "    → GitHub → Settings → Environments → production → Add DATABASE_URL"
            echo "    Skipping migrations — deploy will continue."
            exit 0
          fi
          if [ "${{ steps.db_check.outcome }}" = "failure" ]; then
            echo "⚠️  DB connection check failed — skipping migrations to allow deploy."
            echo "    Fix DATABASE_URL in GitHub Environments and re-run the workflow."
            exit 0
          fi
          node db/migrate-all.js
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # ── Deploy Backend to Render ──────────────────────────────────────────────
  # Render watches the connected GitHub repo for auto-deploys on push to main.
  # This job triggers an explicit deploy via the Render deploy hook URL so the
  # deploy is synchronised with the migration step above.
  # If RENDER_DEPLOY_HOOK_URL is not set the job prints a notice and exits
  # cleanly — Render's built-in Git integration will still pick up the push.
  deploy-backend:
    name: Deploy Backend → Render
    needs: [gate, migrate]
    if: needs.gate.outputs.proceed == 'true' && needs.migrate.result != 'cancelled'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check Render deploy hook
        id: hook_check
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "has_hook=false" >> $GITHUB_OUTPUT
            echo "⚠️  RENDER_DEPLOY_HOOK_URL secret is not set."
            echo "    Render will auto-deploy via its Git integration within 1–2 minutes."
            echo "    To enable explicit deploys: Render → your service → Settings → Deploy Hook → Copy URL"
            echo "    Then add RENDER_DEPLOY_HOOK_URL to GitHub Secrets."
          else
            echo "has_hook=true" >> $GITHUB_OUTPUT
            echo "✅ RENDER_DEPLOY_HOOK_URL found — triggering explicit deploy."
          fi

      - name: Trigger Render deploy
        if: steps.hook_check.outputs.has_hook == 'true'
        run: |
          HTTP_STATUS=$(curl -fsSL -o /dev/null -w "%{http_code}" \
            --retry 3 --retry-delay 5 \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Render deploy hook responded with HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Render accepted the deploy request."
          else
            echo "❌ Render deploy hook returned $HTTP_STATUS — check Render logs."
            exit 1
          fi

      - name: Render auto-deploy notice
        if: steps.hook_check.outputs.has_hook != 'true'
        run: |
          echo "ℹ️  Explicit Render deploy hook skipped."
          echo "    Render will deploy automatically from the GitHub Git integration."
          echo "    Check status at: https://dashboard.render.com"

  # ── Deploy Frontend to Vercel ─────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (Next.js) → Vercel
    needs: [gate, migrate, changes]
    if: needs.gate.outputs.proceed == 'true' && needs.migrate.result != 'cancelled' && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend-next

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend-next

      - name: Deploy to Vercel
        id: deploy
        run: |
          for attempt in 1 2; do
            echo "Submitting Vercel deployment (attempt $attempt of 2)..."
            if vercel deploy --prebuilt --prod --yes --no-wait --token=${{ secrets.VERCEL_TOKEN }}; then
              echo "✅ Vercel accepted the deployment request."
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then
              delay=5
              echo "⚠️ Upload failed. Retrying in ${delay}s..."
              sleep "$delay"
            fi
          done
          echo "❌ Vercel deployment failed after 2 upload attempts."
          exit 1
        working-directory: frontend-next

  # ── Post-deploy health check ─────────────────────────────────────────────────
  # Non-blocking: a failed health check logs a warning but does NOT fail the
  # workflow. The health check is informational only.
  healthcheck:
    name: Post-deploy Health Check
    runs-on: ubuntu-latest
    needs: [gate, deploy-backend, deploy-frontend]
    if: always() && needs.gate.outputs.proceed == 'true' && needs.deploy-backend.result == 'success' && (needs.deploy-frontend.result == 'success' || needs.deploy-frontend.result == 'skipped')
    continue-on-error: true

    steps:
      - name: Wait for services to stabilise
        run: sleep 30

      - name: Check backend health
        id: backend_health
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "⚠️  BACKEND_URL secret not set — marking check as skipped"
            echo "result=skipped" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Pinging $BACKEND_URL/health ..."
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 "$BACKEND_URL/health" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend healthy (attempt $i)"
              echo "result=ok" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "⏳ Attempt $i — status $STATUS, waiting 15s..."
            sleep 15
          done
          echo "⚠️  Backend returned non-200 after 3 attempts"
          echo "result=fail" >> $GITHUB_OUTPUT
          exit 0
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}

      - name: Check frontend health
        id: frontend_health
        if: needs.deploy-frontend.result == 'success'
        run: |
          CHECK_URL="${FRONTEND_URL:-https://nodbusiness.vercel.app}"
          echo "Checking frontend at $CHECK_URL ..."
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 "$CHECK_URL" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "307" ] || [ "$STATUS" = "308" ]; then
              echo "✅ Frontend healthy (status $STATUS)"
              echo "result=ok" >> $GITHUB_OUTPUT
              exit 0
            fi
            sleep 15
          done
          echo "⚠️  Frontend returned status $STATUS after retries"
          echo "result=fail" >> $GITHUB_OUTPUT
          exit 0
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}

      - name: Notify Telegram on failure
        if: steps.backend_health.outputs.result == 'fail' || steps.frontend_health.outputs.result == 'fail'
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ℹ️ Telegram secrets not set — skipping notification"
            exit 0
          fi
          MSG=$'<b>Deploy health check FAILED</b>\nCommit: <code>'"${GITHUB_SHA}"'</code>\nBackend: '"${{ steps.backend_health.outputs.result }}"' · Frontend: '"${{ steps.frontend_health.outputs.result }}"$'\nAction: consider immediate rollback (git revert + push) per docs/infrastructure/CI_CD_PIPELINE.md'
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d parse_mode="HTML" \
            --data-urlencode text="$MSG" > /dev/null || true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_SHA: ${{ github.sha }}
