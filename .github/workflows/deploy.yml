name: Nodbusiness Deploy

# Deploys ONLY after CI ("Nodbusiness CI") succeeds on main (TD-019).
# The push trigger was removed: deploys are chained to the CI run instead,
# so a red build can never reach production.
on:
  workflow_run:
    workflows: ["Nodbusiness CI"]
    types: [completed]
    branches: [main]

# Only run one deploy at a time
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── Gate: only proceed when the pinned CI run passed for this exact commit ──
  gate:
    name: Gate — require green CI on this commit
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Check CI result and commit match
        id: check
        run: |
          echo "CI conclusion : ${{ github.event.workflow_run.conclusion }}"
          echo "CI head commit : ${{ github.event.workflow_run.head_commit.id }}"
          echo "Deploy target  : ${{ github.sha }}"
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "❌ CI did not pass — blocking deploy."
            echo "proceed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ -n "${{ github.event.workflow_run.head_commit.id }}" ] && \
             [ "${{ github.event.workflow_run.head_commit.id }}" != "${{ github.sha }}" ]; then
            echo "ℹ️ A newer commit is queued — letting its own deploy handle this."
            echo "proceed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "✅ Green CI for this exact commit."
          echo "proceed=true" >> $GITHUB_OUTPUT

  # ── Run DB Migrations on Neon ────────────────────────────────────────────────
  # Non-blocking: if Neon is unreachable or quota-exhausted, deploy proceeds
  # anyway. The app works fine without new migrations if the schema is current.
  # Migrations are idempotent — they'll catch up when Neon recovers.
  migrate:
    name: Run DB Migrations → Neon
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment: production
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run migrations
        id: migrate
        continue-on-error: true
        run: node db/migrate-all.js --if-pending
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

      - name: Migration status
        if: always()
        run: |
          if [ "${{ steps.migrate.outcome }}" = "success" ]; then
            echo "✅ Migrations applied successfully."
          else
            echo "⚠️  Migration step failed or was skipped."
            echo "    This is non-blocking — the deploy will continue."
            echo "    The app works fine if the schema is already current."
            echo "    Migrations will catch up when Neon recovers."
          fi

  # ── Deploy Backend to Railway ─────────────────────────────────────────────────
  # Railway auto-deploys from the connected GitHub repo on every push to main.
  # This job provides a fallback explicit deploy via CLI when RAILWAY_TOKEN is valid.
  # If the token is missing/expired the step is skipped gracefully — Railway's
  # own git-integration still picks up the push independently.
  deploy-backend:
    name: Deploy Backend → Railway
    needs: [gate, migrate]
    if: always() && needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Check Railway token
        id: token_check
        run: |
          if [ -z "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "⚠️  RAILWAY_TOKEN secret is not set. Railway will auto-deploy via git integration."
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
            echo "✅ RAILWAY_TOKEN found — will attempt explicit deploy."
          fi

      - name: Install Railway CLI
        if: steps.token_check.outputs.has_token == 'true'
        run: npm install -g @railway/cli --allow-scripts=@railway/cli

      - name: Validate Railway token
        if: steps.token_check.outputs.has_token == 'true'
        id: validate_token
        continue-on-error: true
        run: |
          if railway whoami; then
            echo "token_valid=true" >> $GITHUB_OUTPUT
          else
            echo "token_valid=false" >> $GITHUB_OUTPUT
            echo "⚠️  RAILWAY_TOKEN is set but invalid/expired."
            echo "    To fix: railway.app → Account Settings → Tokens → New Token"
            echo "    Then update: GitHub → Settings → Secrets → RAILWAY_TOKEN"
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy to Railway
        if: steps.token_check.outputs.has_token == 'true' && steps.validate_token.outputs.token_valid == 'true'
        run: railway up --service halehame-backend --detach
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Railway auto-deploy notice
        if: steps.token_check.outputs.has_token != 'true' || steps.validate_token.outputs.token_valid != 'true'
        run: |
          echo "ℹ️  Explicit Railway CLI deploy skipped."
          echo "    Railway will deploy automatically from the GitHub git integration within 1–2 minutes."
          echo "    Check status at: https://railway.app/dashboard"

  # ── Deploy Frontend to Vercel ─────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (Next.js) → Vercel
    needs: [gate, migrate]
    if: always() && needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend-next

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend-next

      - name: Deploy to Vercel
        # Archive avoids thousands of individual upload requests from the
        # prebuilt Next.js output. Retry only the upload, since `vercel build`
        # already succeeded and failures here are commonly transient.
        run: |
          for attempt in 1 2 3; do
            echo "Deploying to Vercel (attempt $attempt of 3)..."
            if vercel deploy --prebuilt --archive=tgz --prod --yes --token=${{ secrets.VERCEL_TOKEN }}; then
              echo "✅ Vercel deployment completed."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "⚠️ Upload failed. Retrying in ${delay}s..."
              sleep "$delay"
            fi
          done

          echo "❌ Vercel deployment failed after 3 upload attempts."
          exit 1
        working-directory: frontend-next

  # ── Post-deploy health check ─────────────────────────────────────────────────
  # BLOCKING (TD-019): a failed health check fails the workflow and pages via
  # Telegram when TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID secrets are configured.
  healthcheck:
    name: Post-deploy Health Check
    runs-on: ubuntu-latest
    needs: [gate, deploy-frontend]
    if: needs.gate.outputs.proceed == 'true'

    steps:
      - name: Wait for Railway to pick up the push
        run: sleep 30

      - name: Check backend health
        id: backend_health
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "⚠️  BACKEND_URL secret not set — marking check as skipped"
            echo "result=skipped" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Pinging $BACKEND_URL/health ..."
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL/health" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend healthy (attempt $i)"
              echo "result=ok" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "⏳ Attempt $i — status $STATUS, waiting 15s..."
            sleep 15
          done
          echo "❌ Backend failed to become healthy after 90s"
          echo "result=fail" >> $GITHUB_OUTPUT
          exit 1
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}

      - name: Check frontend health
        id: frontend_health
        run: |
          CHECK_URL="${FRONTEND_URL:-https://halehame-eosin.vercel.app}"
          echo "Checking frontend at $CHECK_URL ..."
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$CHECK_URL" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "307" ] || [ "$STATUS" = "308" ]; then
              echo "✅ Frontend healthy (status $STATUS)"
              echo "result=ok" >> $GITHUB_OUTPUT
              exit 0
            fi
            sleep 15
          done
          echo "❌ Frontend returned status $STATUS after retries"
          echo "result=fail" >> $GITHUB_OUTPUT
          exit 1
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}

      - name: Notify Telegram on failure
        if: failure()
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ℹ️ Telegram secrets not set — skipping notification"
            exit 0
          fi
          MSG=$'<b>Deploy health check FAILED</b>\nCommit: <code>'"${GITHUB_SHA}"'</code>\nBackend: '"${{ steps.backend_health.outputs.result }}"' · Frontend: '"${{ steps.frontend_health.outputs.result }}"$'\nAction: consider immediate rollback (git revert + push) per docs/infrastructure/CI_CD_PIPELINE.md'
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d parse_mode="HTML" \
            --data-urlencode text="$MSG" > /dev/null || true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_SHA: ${{ github.sha }}
