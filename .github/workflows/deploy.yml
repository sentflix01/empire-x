name: Empire X Deploy

on:
  push:
    branches: [main]

# Only run one deploy at a time
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── Run DB Migrations on Neon ────────────────────────────────────────────────
  # Runs automatically on every push to main.
  # Works from any device — no local DB needed.
  migrate:
    name: Run DB Migrations → Neon
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run migrations
        run: node db/migrate-all.js
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

  # ── Deploy Backend to Railway ─────────────────────────────────────────────────
  # Railway auto-deploys from the connected GitHub repo on every push to main.
  # This job provides a fallback explicit deploy via CLI when RAILWAY_TOKEN is valid.
  # If the token is missing/expired the step is skipped gracefully — Railway's
  # own git-integration still picks up the push independently.
  deploy-backend:
    name: Deploy Backend → Railway
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Check Railway token
        id: token_check
        run: |
          if [ -z "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "⚠️  RAILWAY_TOKEN secret is not set. Railway will auto-deploy via git integration."
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
            echo "✅ RAILWAY_TOKEN found — will attempt explicit deploy."
          fi

      - name: Install Railway CLI
        if: steps.token_check.outputs.has_token == 'true'
        run: npm install -g @railway/cli --allow-scripts=@railway/cli

      - name: Validate Railway token
        if: steps.token_check.outputs.has_token == 'true'
        id: validate_token
        continue-on-error: true
        run: |
          if railway whoami; then
            echo "token_valid=true" >> $GITHUB_OUTPUT
          else
            echo "token_valid=false" >> $GITHUB_OUTPUT
            echo "⚠️  RAILWAY_TOKEN is set but invalid/expired."
            echo "    To fix: railway.app → Account Settings → Tokens → New Token"
            echo "    Then update: GitHub → Settings → Secrets → RAILWAY_TOKEN"
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy to Railway
        if: steps.token_check.outputs.has_token == 'true' && steps.validate_token.outputs.token_valid == 'true'
        run: railway up --service empire-x-backend --detach
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Railway auto-deploy notice
        if: steps.token_check.outputs.has_token != 'true' || steps.validate_token.outputs.token_valid != 'true'
        run: |
          echo "ℹ️  Explicit Railway CLI deploy skipped."
          echo "    Railway will deploy automatically from the GitHub git integration within 1–2 minutes."
          echo "    Check status at: https://railway.app/dashboard"

  # ── Deploy Frontend to Vercel ─────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (Next.js) → Vercel
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend-next

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend-next

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend-next

  # ── Post-deploy health check ─────────────────────────────────────────────────
  healthcheck:
    name: Post-deploy Health Check
    runs-on: ubuntu-latest
    needs: [deploy-frontend]

    steps:
      - name: Wait for Railway to pick up the push
        run: sleep 30

      - name: Check backend health
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "⚠️  BACKEND_URL secret not set — skipping health check"
            exit 0
          fi
          echo "Pinging $BACKEND_URL/health ..."
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL/health" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend healthy (attempt $i)"
              exit 0
            fi
            echo "⏳ Attempt $i — status $STATUS, waiting 15s..."
            sleep 15
          done
          echo "⚠️  Backend health check could not confirm 200 — check Railway dashboard"
          exit 0
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}

      - name: Check frontend health
        run: |
          # Use secret if set, otherwise fall back to known Vercel URL
          CHECK_URL="${FRONTEND_URL:-https://empire-x-eosin.vercel.app}"
          echo "Checking frontend at $CHECK_URL ..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$CHECK_URL" 2>/dev/null || echo "000")
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "307" ] || [ "$STATUS" = "308" ]; then
            echo "✅ Frontend healthy (status $STATUS)"
          else
            echo "⚠️  Frontend returned status $STATUS — check Vercel dashboard"
          fi
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
