name: Empire X Deploy

on:
  push:
    branches: [main]

# Only run one deploy at a time
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── Deploy Backend to Railway ─────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Railway
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Debug Railway auth and service access
        continue-on-error: true
        run: |
          railway whoami
          railway status || true
          railway service list || true
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy to Railway
        run: railway up --service empire-x-backend --detach || echo "⚠️ Railway deploy failed — check RAILWAY_TOKEN secret"
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ── Deploy Frontend to Vercel ─────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (Next.js) → Vercel
    runs-on: ubuntu-latest
    environment: production
    # Runs independently — does not wait for backend so a Railway token
    # expiry doesn't block frontend deployments.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend-next

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend-next

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend-next

  # ── Post-deploy health check ─────────────────────────────────────────────────
  healthcheck:
    name: Post-deploy Health Check
    runs-on: ubuntu-latest
    needs: [deploy-frontend]

    steps:
      - name: Check backend health
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.BACKEND_URL }}/health)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend healthy"
              exit 0
            fi
            echo "⏳ Attempt $i — status $STATUS, waiting..."
            sleep 10
          done
          echo "⚠️ Backend health check failed — Railway token may be invalid or backend not deployed"
          exit 0
