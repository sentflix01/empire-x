name: DB migrate -> Neon (manual)

# Runs all pending migrations against the Neon production database.
# Use this when you add a new migrate*.js file and want to apply it to Neon
# without waiting for a full Railway deploy.
#
# It uses Node.js (same as the app) so SSL/channel_binding works correctly.

on:
  workflow_dispatch:

jobs:
  migrate:
    name: Run migrations on Neon
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.NEON_DATABASE_URL }}" ]; then
            echo "ERROR: NEON_DATABASE_URL secret is not set."
            echo "Go to: GitHub -> Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi
          echo "✅ NEON_DATABASE_URL is set."

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run all migrations
        run: node db/migrate-all.js
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

      - name: Verify tables
        run: |
          node -e "
          const { Pool } = require('pg');
          const pool = new Pool({ connectionString: process.env.DATABASE_URL });
          pool.query(\"SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY tablename\")
            .then(r => {
              console.log('✅ Tables in Neon (' + r.rows.length + '):');
              r.rows.forEach(row => console.log('  -', row.tablename));
              return pool.query('SELECT COUNT(*) FROM users');
            })
            .then(r => console.log('👥 Users count:', r.rows[0].count))
            .finally(() => pool.end());
          "
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
