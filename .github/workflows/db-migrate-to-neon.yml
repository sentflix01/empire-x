name: DB migrate -> Neon (manual)

# WARNING: GitHub Actions runners must be able to reach the SOURCE_DATABASE_URL.
# This workflow is meant for environments where the source DB is network-accessible
# (e.g., a staging DB, a bastion, or a cloud-hosted DB). It cannot access a
# 'localhost' Postgres on your laptop unless you expose it to the public runner
# (not recommended). Run scripts/export_and_restore_to_neon.ps1 locally instead.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — dump only, do not restore to Neon'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  migrate:
    name: Dump source DB and restore to Neon
    runs-on: ubuntu-latest

    env:
      DUMP_FILE: db_dump.bak

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          MISSING=""
          if [ -z "${{ secrets.NEON_DATABASE_URL }}" ]; then
            MISSING="$MISSING NEON_DATABASE_URL"
          fi
          if [ -n "$MISSING" ]; then
            echo "ERROR: The following secrets are not set:$MISSING"
            echo "Go to: GitHub -> Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi
          # SOURCE_DATABASE_URL is optional — falls back to NEON_DATABASE_URL if not set
          if [ -z "${{ secrets.SOURCE_DATABASE_URL }}" ]; then
            echo "ℹ️  SOURCE_DATABASE_URL not set — will use NEON_DATABASE_URL as source (backup mode)"
          fi
          echo "All required secrets are present."

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Show client versions
        run: |
          psql --version || true
          pg_dump --version || true
          pg_restore --version || true

      - name: Dump source database (pg_dump)
        run: |
          # Use SOURCE_DATABASE_URL if set, otherwise fall back to NEON_DATABASE_URL
          SOURCE="${{ secrets.SOURCE_DATABASE_URL }}"
          if [ -z "$SOURCE" ]; then
            SOURCE="${{ secrets.NEON_DATABASE_URL }}"
            echo "ℹ️  Using NEON_DATABASE_URL as source (backup/self-copy mode)"
          fi
          echo "Dumping source DB to $DUMP_FILE ..."
          PGSSLMODE=require pg_dump -Fc -v -d "$SOURCE" --schema=public -f "$DUMP_FILE"
          echo "Dump complete. Size: $(du -sh $DUMP_FILE | cut -f1)"

      - name: Upload dump artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-dump-${{ github.run_number }}
          path: ${{ env.DUMP_FILE }}
          retention-days: 3

      - name: Restore to Neon (pg_restore)
        if: github.event.inputs.dry_run != 'true'
        run: |
          echo "Restoring $DUMP_FILE -> Neon ..."
          PGSSLMODE=require pg_restore -d "${{ secrets.NEON_DATABASE_URL }}" -v --no-owner --no-acl "$DUMP_FILE" || true
          echo "Restore complete."

      - name: Skip restore (dry run)
        if: github.event.inputs.dry_run == 'true'
        run: echo "DRY RUN - restore step skipped. Dump artifact is available above."

      - name: Verify restore on Neon
        if: github.event.inputs.dry_run != 'true'
        run: |
          echo "Verifying tables on Neon..."
          PGSSLMODE=require psql "${{ secrets.NEON_DATABASE_URL }}" -c "\dt" || true
          echo "Users count:"
          PGSSLMODE=require psql "${{ secrets.NEON_DATABASE_URL }}" -c "SELECT COUNT(*) FROM users;" || true

      - name: Finish
        run: |
          echo "Done."
          echo "If the source DB was not reachable from the GitHub runner, run locally:"
          echo "  scripts/export_and_restore_to_neon.ps1"
